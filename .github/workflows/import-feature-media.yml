name: Import feature media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-feature-media.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download feature GIFs
        run: |
          set -euo pipefail
          mkdir -p media
          SRC1="https://raw.githubusercontent.com/Promande/Deep-Live-Cam-PRO/main/media"
          SRC2="https://raw.githubusercontent.com/hacksider/Deep-Live-Cam/main/media"
          for f in ludwig.gif streamers.gif movie.gif; do
            echo "==> $f"
            if [ -s "media/$f" ]; then echo present; continue; fi
            if ! curl -fsSL --retry 3 "$SRC1/$f" -o "media/$f"; then
              curl -fsSL --retry 3 "$SRC2/$f" -o "media/$f"
            fi
            ls -lh "media/$f"
            test -s "media/$f"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "Add feature GIFs: Mouth Mask, Face Mapping, Movie"
            git push
          fi
