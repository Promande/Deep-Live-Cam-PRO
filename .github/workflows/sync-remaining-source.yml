name: Sync remaining source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-remaining-source.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull full text sources from sibling public mirror
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/Promande/Deep-Live-Cam-PRO/main"
          FILES=(
            "modules/__init__.py"
            "modules/capturer.py"
            "modules/cluster_analysis.py"
            "modules/core.py"
            "modules/custom_types.py"
            "modules/face_analyser.py"
            "modules/gettext.py"
            "modules/globals.py"
            "modules/gpu_processing.py"
            "modules/metadata.py"
            "modules/onnx_optimize.py"
            "modules/paths.py"
            "modules/platform_info.py"
            "modules/predicter.py"
            "modules/run.py"
            "modules/tkinter_fix.py"
            "modules/typing.py"
            "modules/ui.json"
            "modules/ui.py"
            "modules/ui_tooltip.py"
            "modules/utilities.py"
            "modules/video_capture.py"
            "modules/processors/__init__.py"
            "modules/processors/frame/__init__.py"
            "modules/processors/frame/_onnx_enhancer.py"
            "modules/processors/frame/core.py"
            "modules/processors/frame/face_enhancer.py"
            "modules/processors/frame/face_enhancer_gpen256.py"
            "modules/processors/frame/face_enhancer_gpen512.py"
            "modules/processors/frame/face_masking.py"
            "modules/processors/frame/face_swapper.py"
            "LICENSE"
            "benchmark_pipeline.py"
            "run.py"
            "tkinter_fix.py"
            "requirements.txt"
            "pyproject.toml"
            "mypi.ini"
            "CONTRIBUTING.md"
            "run-cuda.bat"
            "run-directml.bat"
            "models/instructions.txt"
            "tests/test_face_analyser_get_one_face.py"
            "locales/de.json"
            "locales/es.json"
            "locales/fi.json"
            "locales/id.json"
            "locales/km.json"
            "locales/ko.json"
            "locales/pt-br.json"
            "locales/ru.json"
            "locales/th.json"
            "locales/zh.json"
            ".gitattributes"
            ".gitignore"
          )
          for f in "${FILES[@]}"; do
            mkdir -p "$(dirname "$f")"
            echo "Fetching $f"
            curl -fsSL "$BASE/$f" -o "$f"
            test -s "$f" || test ! -s /dev/null
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh full source tree from complete mirror"
            git push
          fi
