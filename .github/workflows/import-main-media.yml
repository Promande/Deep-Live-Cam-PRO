name: Import main media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-main-media.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download main media assets
        run: |
          set -euo pipefail
          mkdir -p media
          SRC1="https://raw.githubusercontent.com/Promande/Deep-Live-Cam-PRO/main/media"
          SRC2="https://raw.githubusercontent.com/hacksider/Deep-Live-Cam/main/media"
          FILES=("demo.gif" "live_show.gif" "meme.gif" "Download.png" "instruction.png")
          for f in "${FILES[@]}"; do
            echo "==> $f"
            if [ -s "media/$f" ]; then
              echo "already present"
              continue
            fi
            if ! curl -fsSL "$SRC1/$f" -o "media/$f"; then
              curl -fsSL "$SRC2/$f" -o "media/$f"
            fi
            ls -lh "media/$f"
            test -s "media/$f"
          done

      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/
          if git diff --cached --quiet; then
            echo "No media changes"
          else
            git commit -m "Ensure main media set complete"
            git push
          fi
