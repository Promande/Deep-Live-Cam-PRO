name: Append Free DIY README section

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/append-free-readme.yml'
      - 'docs/free-diy-install.md'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append Free section if missing
        run: |
          set -euo pipefail
          if grep -q '### Free (DIY)' README.md; then
            echo "Free section already present"
            exit 0
          fi
          printf '\n' >> README.md
          cat docs/free-diy-install.md >> README.md
          printf '\n' >> README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "Add collapsible Free DIY install section after PRO offer"
            git push
          fi
