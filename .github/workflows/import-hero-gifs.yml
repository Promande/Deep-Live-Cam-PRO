name: Import hero GIFs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-hero-gifs.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download hero GIFs
        run: |
          set -euo pipefail
          mkdir -p media
          curl -fsSL "https://files.catbox.moe/1j6fti.gif" -o media/elon_mask.gif
          curl -fsSL "https://files.catbox.moe/9xfn1a.gif" -o media/bruce_lee.gif
          ls -lh media/elon_mask.gif media/bruce_lee.gif
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('media/elon_mask.gif'), Path('media/bruce_lee.gif')]:
              assert p.read_bytes()[:6] in (b'GIF87a', b'GIF89a'), p
              print(p, 'OK', p.stat().st_size)
          PY

      - name: Update README hero
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('README.md')
          t = p.read_text(encoding='utf-8')
          if 'media/elon_mask.gif' in t and 'media/bruce_lee.gif' in t:
              print('hero already updated')
          else:
              new = '<p align="center">\n  <img src="media/elon_mask.gif" alt="DeepLiveCam PRO — Elon Musk face swap demo" width="48%">\n  &nbsp;\n  <img src="media/bruce_lee.gif" alt="DeepLiveCam PRO — Bruce Lee face swap demo" width="48%">\n</p>'
              old = '<p align="center">\n  <img src="media/demo.gif" alt="DeepLiveCam PRO demo" width="800">\n</p>'
              if old in t:
                  t = t.replace(old, new, 1)
              else:
                  t2, n = re.subn(
                      r'<p align="center">\s*<img src="media/demo\.gif"[^>]*>\s*</p>',
                      new, t, count=1, flags=re.S,
                  )
                  assert n == 1, 'hero demo.gif block not found'
                  t = t2
              p.write_text(t, encoding='utf-8')
              print('README hero updated')
          assert 'elon_mask.gif' in p.read_text(encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/elon_mask.gif media/bruce_lee.gif README.md
          if git diff --cached --quiet; then
            echo no changes
            exit 0
          fi
          git commit -m "Replace hero with Elon Musk and Bruce Lee demo GIFs"
          git pull --rebase origin main
          git push
